name: NetHunter Kernel - secret MIUI14

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: تثبيت الأدوات
        run: |
          sudo apt update -y
          sudo apt install -y \
            git make bc bison flex \
            libssl-dev libelf-dev \
            python3 python3-pip \
            build-essential ccache \
            zip unzip curl wget \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            libncurses-dev

      - name: تنزيل Clang 17
        run: |
          mkdir -p $HOME/clang
          wget -q \
            https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230614-release/Clang-17.0.0-20230614.tar.gz \
            -O clang.tar.gz
          tar -xf clang.tar.gz -C $HOME/clang

      - name: تنزيل GCC 64bit
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            $HOME/gcc64

      - name: تنزيل GCC 32bit
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            $HOME/gcc32

      - name: إعداد متغيرات البيئة
        run: |
          echo "PATH=$HOME/clang/bin:$HOME/gcc64/bin:$HOME/gcc32/bin:$PATH" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CLANG_PATH=$HOME/clang/bin" >> $GITHUB_ENV
          echo "GCC64=$HOME/gcc64/bin/aarch64-linux-android-" >> $GITHUB_ENV
          echo "GCC32=$HOME/gcc32/bin/arm-linux-androideabi-" >> $GITHUB_ENV

      - name: تطبيق defconfig
        run: |
          export PATH=$HOME/clang/bin:$HOME/gcc64/bin:$HOME/gcc32/bin:$PATH
          make \
            O=out \
            ARCH=arm64 \
            CC=$HOME/clang/bin/clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$HOME/gcc64/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=$HOME/gcc32/bin/arm-linux-androideabi- \
            AR=$HOME/clang/bin/llvm-ar \
            NM=$HOME/clang/bin/llvm-nm \
            OBJCOPY=$HOME/clang/bin/llvm-objcopy \
            OBJDUMP=$HOME/clang/bin/llvm-objdump \
            STRIP=$HOME/clang/bin/llvm-strip \
            LD=$HOME/clang/bin/ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            rosemary_defconfig

      - name: إضافة NetHunter Config
        run: |
          export PATH=$HOME/clang/bin:$HOME/gcc64/bin:$HOME/gcc32/bin:$PATH

          # WiFi Monitor Mode + Injection
          scripts/config --file out/.config \
            -e CFG80211 \
            -e CFG80211_WEXT \
            -e MAC80211 \
            -e MAC80211_MESH \
            -e RFKILL

          # Bluetooth
          scripts/config --file out/.config \
            -e BT \
            -e BT_RFCOMM \
            -e BT_RFCOMM_TTY \
            -e BT_BNEP \
            -e BT_BNEP_MC_FILTER \
            -e BT_BNEP_PROTO_FILTER \
            -e BT_HIDP \
            -e BT_LE

          # HID Attacks
          scripts/config --file out/.config \
            -e HID \
            -e USB_HID \
            -e HID_GENERIC \
            -e USB_CONFIGFS_F_HID \
            -e USB_CONFIGFS_F_SERIAL \
            -e USB_CONFIGFS_MASS_STORAGE

          # USB RNDIS
          scripts/config --file out/.config \
            -e USB_CONFIGFS_RNDIS \
            -e USB_ETH_RNDIS

          # VPN / TUN
          scripts/config --file out/.config \
            -e TUN \
            -e PPP \
            -e PPP_ASYNC \
            -e PPP_SYNC_TTY \
            -e PPP_DEFLATE \
            -e PPP_BSDCOMP \
            -e PPPOE \
            -e PPTP

          # Namespaces للـ chroot
          scripts/config --file out/.config \
            -e USER_NS \
            -e PID_NS \
            -e NET_NS \
            -e IPC_NS \
            -e UTS_NS

          # OverlayFS
          scripts/config --file out/.config \
            -e OVERLAY_FS

          # Network
          scripts/config --file out/.config \
            -e PACKET \
            -e NETFILTER \
            -e NF_CONNTRACK \
            -e NETFILTER_ADVANCED

          # Crypto
          scripts/config --file out/.config \
            -e CRYPTO_SHA256 \
            -e CRYPTO_SHA512 \
            -e CRYPTO_AES

          # تحديث الـ config وحل التبعيات تلقائياً
          make \
            O=out \
            ARCH=arm64 \
            CC=$HOME/clang/bin/clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$HOME/gcc64/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=$HOME/gcc32/bin/arm-linux-androideabi- \
            AR=$HOME/clang/bin/llvm-ar \
            NM=$HOME/clang/bin/llvm-nm \
            OBJCOPY=$HOME/clang/bin/llvm-objcopy \
            OBJDUMP=$HOME/clang/bin/llvm-objdump \
            STRIP=$HOME/clang/bin/llvm-strip \
            LD=$HOME/clang/bin/ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      - name: بناء الكيرنل
        run: |
          export PATH=$HOME/clang/bin:$HOME/gcc64/bin:$HOME/gcc32/bin:$PATH
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC=$HOME/clang/bin/clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$HOME/gcc64/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=$HOME/gcc32/bin/arm-linux-androideabi- \
            AR=$HOME/clang/bin/llvm-ar \
            NM=$HOME/clang/bin/llvm-nm \
            OBJCOPY=$HOME/clang/bin/llvm-objcopy \
            OBJDUMP=$HOME/clang/bin/llvm-objdump \
            STRIP=$HOME/clang/bin/llvm-strip \
            LD=$HOME/clang/bin/ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            2>&1 | tee out/build.log

      - name: التحقق من نجاح البناء
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "KERNEL_IMG=out/arch/arm64/boot/Image.gz-dtb" >> $GITHUB_ENV
            echo "✅ وجدنا Image.gz-dtb"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "KERNEL_IMG=out/arch/arm64/boot/Image.gz" >> $GITHUB_ENV
            echo "✅ وجدنا Image.gz"
          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "KERNEL_IMG=out/arch/arm64/boot/Image" >> $GITHUB_ENV
            echo "✅ وجدنا Image"
          else
            echo "❌ فشل البناء - لم يوجد ملف الكيرنل"
            tail -100 out/build.log
            exit 1
          fi

      - name: تجهيز AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          cp ${{ env.KERNEL_IMG }} AnyKernel3/

          [ -f out/arch/arm64/boot/dtbo.img ] && \
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/

          cat > AnyKernel3/anykernel.sh << 'AKEOF'
          properties() { '
          kernel.string=NetHunter Kernel MIUI14
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=secret
          device.name2=rosemary
          device.name3=maltose
          supported.versions=13
          '; }

          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          AKEOF

          cd AnyKernel3
          zip -r9 \
            ../NetHunter-secret-MIUI14-$(date +%Y%m%d).zip . \
            -x ".git/*" "*.zip" "README.md"

      - name: رفع الناتج
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-secret-MIUI14
          path: |
            NetHunter-*.zip
            out/build.log
          retention-days: 7
